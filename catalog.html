<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог нерухомості — EstateHub</title><link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="catalog">
<header class="header"><nav class="container nav"><a class="logo" href="index.html"><span class="logo-mark">EH</span><span>EstateHub</span></a><button class="menu-toggle">☰</button><div class="nav-links"><a data-page="home" href="index.html">Головна</a><a data-page="catalog" href="catalog.html">Каталог</a><a data-page="about" href="about.html">Про агентство</a><a data-page="contacts" href="contacts.html">Контакти</a><a data-page="admin" href="admin.html">Адмінпанель</a></div></nav></header>
<main>
  <section class="hero small"><div class="container"><p class="eyebrow">Каталог</p><h1>Пошук об’єктів нерухомості</h1><p class="lead">Скористайтеся фільтрами, щоб швидко знайти потрібний об’єкт за типом, операцією, ціною або кількістю кімнат.</p></div></section>
  <section class="section">
    <div class="container catalog-layout">
      <aside class="card filters">
        <h3>Фільтри</h3>
        <div class="form-row"><label for="q">Пошук</label><input id="q" class="input" placeholder="Назва, район, місто"></div>
        <div class="form-row"><label for="type">Тип</label><select id="type" class="select"><option value="">Усі типи</option><option>Квартира</option><option>Будинок</option><option>Комерційна нерухомість</option><option>Земельна ділянка</option></select></div>
        <div class="form-row"><label for="operation">Операція</label><select id="operation" class="select"><option value="">Усі операції</option><option>Продаж</option><option>Оренда</option></select></div>
        <div class="form-row"><label for="rooms">Кімнати</label><select id="rooms" class="select"><option value="">Будь-яка кількість</option><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></div>
        <div class="form-grid"><div class="form-row"><label for="priceMin">Ціна від</label><input id="priceMin" class="input" type="number" min="0"></div><div class="form-row"><label for="priceMax">Ціна до</label><input id="priceMax" class="input" type="number" min="0"></div></div>
        <button id="resetFilters" class="btn secondary" type="button" style="width:100%">Скинути</button>
      </aside>
      <div>
        <div class="catalog-top"><strong id="resultCount">0 об’єктів знайдено</strong><select id="sort" class="select" style="max-width:260px"><option value="newest">Спочатку нові</option><option value="priceAsc">Ціна зростає</option><option value="priceDesc">Ціна спадає</option></select></div>
        <div id="catalogGrid" class="property-grid"></div>
      </div>
    </div>
  </section>
</main>
<footer class="footer"><div class="container footer-grid"><div><strong>EstateHub</strong><br>Інтерактивний каталог об’єктів.</div><div>© 2026</div></div></footer>
<script src="js/app.js"></script>
</body></html>
